{{ partial "header.html" . }}

{{ partial "navbar.html" . }}

<header class="small">
	<div class="inner">
		<div class="left">
			<h1>{{ site.Params.Dates }}</h1>
		</div>
		<div class="right">
			<h2>{{ site.Params.Location }}</h2>
		</div>
	</div>
</header>

<div id="container">
<section id="posts">
<div class="inner">

<h1>Past, Current and Future Events</h1>

<ul>
	{{ range .Site.Languages }}
		<li><a href="/{{ . }}/">{{ .Title }}</a></li>
	{{ end }}
</ul>

</div>
</section>
</div>

{{ partial "footer.html" . }}
